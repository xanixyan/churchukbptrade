# ============================================================================
# churchukbptrade — Docker Compose (development)
# ============================================================================
#
# Start:   docker compose -f docker-compose.dev.yml up --build
# Tests:   docker compose -f docker-compose.dev.yml run --rm web npm run test:concurrency
# ============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules          # prevent host node_modules from overwriting
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true      # hot reload inside Docker (Linux/Windows/macOS)
      - CHOKIDAR_USEPOLLING=true    # fallback for older watchers
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
